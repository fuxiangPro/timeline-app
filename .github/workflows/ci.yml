name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check JavaScript files
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js

      - name: Validate package.json
        run: node -e "require('./package.json')"

      - name: Validate data.json
        run: node -e "JSON.parse(require('fs').readFileSync('data.json','utf-8'))"

      - name: Check installer script
        run: bash -n installer/timeline-app.command
