name: 🐛 Bug Report
description: Report a bug in Timeline App
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! 🙏
        Please fill out the form below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: Describe what's broken...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open the app
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Screen Recording
      description: A picture is worth a thousand words.
      placeholder: Drag and drop here...

  - type: input
    id: macos
    attributes:
      label: macOS Version
      placeholder: "e.g., macOS 14.4 Sonoma"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js Version
      description: Run `node --version`
      placeholder: "e.g., v20.10.0"

  - type: input
    id: app
    attributes:
      label: Timeline App Version
      placeholder: "e.g., 1.0.0"

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Logs, error messages, or anything else useful.
