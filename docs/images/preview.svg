<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="0.5" stop-color="#16213e"/>
      <stop offset="1" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="appBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(40,40,60,0.55)"/>
      <stop offset="1" stop-color="rgba(20,20,35,0.65)"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Wallpaper -->
  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- Decorative blurred shapes -->
  <circle cx="200" cy="150" r="120" fill="#ff6b9d" opacity="0.3" filter="url(#blur)"/>
  <circle cx="1000" cy="500" r="180" fill="#5e60ce" opacity="0.4" filter="url(#blur)"/>
  <circle cx="600" cy="650" r="100" fill="#48bfe3" opacity="0.3" filter="url(#blur)"/>

  <!-- App window -->
  <g filter="url(#shadow)">
    <rect x="100" y="80" width="1000" height="540" rx="14" fill="url(#appBg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Traffic light buttons -->
    <circle cx="130" cy="105" r="6" fill="#ff5f57"/>
    <circle cx="150" cy="105" r="6" fill="#febc2e"/>
    <circle cx="170" cy="105" r="6" fill="#28c840"/>

    <!-- Header -->
    <text x="600" y="110" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">⏱  Timeline</text>

    <!-- ===== Main Line 1: Q2 产品规划 ===== -->
    <text x="140" y="170" fill="rgba(255,255,255,0.95)" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Q2 产品规划</text>
    <text x="260" y="170" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="11">04.01 — 06.30</text>

    <!-- Track line -->
    <line x1="140" y1="210" x2="1060" y2="210" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <!-- Today marker -->
    <line x1="450" y1="190" x2="450" y2="230" stroke="rgba(255,220,80,0.6)" stroke-width="2"/>
    <text x="450" y="186" text-anchor="middle" fill="rgba(255,220,80,0.8)" font-family="-apple-system, sans-serif" font-size="10">TODAY</text>

    <!-- Nodes -->
    <g>
      <!-- Node 1: completed -->
      <circle cx="200" cy="210" r="9" fill="#28c840" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <path d="M196 210 L199 213 L204 207" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="200" y="187" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="-apple-system, sans-serif" font-size="10">需求评审</text>
      <text x="200" y="240" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="-apple-system, sans-serif" font-size="9">04.05</text>

      <!-- Node 2: completed -->
      <circle cx="320" cy="210" r="9" fill="#28c840" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <path d="M316 210 L319 213 L324 207" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="320" y="240" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="-apple-system, sans-serif" font-size="10">原型设计</text>
      <text x="320" y="257" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="-apple-system, sans-serif" font-size="9">04.20</text>

      <!-- Node 3: in progress -->
      <circle cx="450" cy="210" r="9" fill="rgba(255,215,70,0.85)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
      <text x="450" y="187" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">UI 评审</text>
      <text x="450" y="245" text-anchor="middle" fill="rgba(255,215,70,0.7)" font-family="-apple-system, sans-serif" font-size="9">今天 · 05.11</text>

      <!-- Node 4: future -->
      <circle cx="600" cy="210" r="9" fill="none" stroke="rgba(185,130,255,0.85)" stroke-width="2"/>
      <text x="600" y="240" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="10">开发启动</text>
      <text x="600" y="257" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="-apple-system, sans-serif" font-size="9">05.25</text>

      <!-- Node 5 -->
      <circle cx="780" cy="210" r="9" fill="none" stroke="rgba(100,220,150,0.85)" stroke-width="2"/>
      <text x="780" y="187" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="10">联调测试</text>
      <text x="780" y="201" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="-apple-system, sans-serif" font-size="9">06.10</text>

      <!-- Node 6 -->
      <circle cx="960" cy="210" r="9" fill="none" stroke="rgba(255,150,180,0.85)" stroke-width="2"/>
      <text x="960" y="240" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="10">正式发布</text>
      <text x="960" y="257" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="-apple-system, sans-serif" font-size="9">06.28</text>
    </g>

    <!-- ===== Main Line 2: 学习计划 ===== -->
    <text x="140" y="330" fill="rgba(255,255,255,0.95)" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">学习计划 · TypeScript 深入</text>
    <text x="370" y="330" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="11">04.10 — 05.30</text>

    <line x1="140" y1="370" x2="1060" y2="370" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="640" y1="350" x2="640" y2="390" stroke="rgba(255,220,80,0.6)" stroke-width="2"/>

    <g>
      <circle cx="220" cy="370" r="9" fill="#28c840" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <path d="M216 370 L219 373 L224 367" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="220" y="347" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="-apple-system, sans-serif" font-size="10">基础语法</text>

      <circle cx="380" cy="370" r="9" fill="#28c840" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <path d="M376 370 L379 373 L384 367" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="380" y="400" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="-apple-system, sans-serif" font-size="10">高级类型</text>

      <circle cx="540" cy="370" r="9" fill="#28c840" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <path d="M536 370 L539 373 L544 367" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="540" y="347" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="-apple-system, sans-serif" font-size="10">泛型实战</text>

      <circle cx="740" cy="370" r="9" fill="none" stroke="rgba(100,220,150,0.85)" stroke-width="2"/>
      <text x="740" y="400" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="10">装饰器 &amp; 元编程</text>

      <circle cx="940" cy="370" r="9" fill="none" stroke="rgba(255,215,70,0.85)" stroke-width="2"/>
      <text x="940" y="347" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="10">项目实战</text>
    </g>

    <!-- ===== Main Line 3: 健康记录 ===== -->
    <text x="140" y="490" fill="rgba(255,255,255,0.95)" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">健康记录</text>
    <text x="240" y="490" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="11">05.01 — 05.31</text>

    <line x1="140" y1="530" x2="1060" y2="530" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="450" y1="510" x2="450" y2="550" stroke="rgba(255,220,80,0.6)" stroke-width="2"/>

    <g>
      <circle cx="200" cy="530" r="9" fill="#28c840" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <path d="M196 530 L199 533 L204 527" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="200" y="507" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="-apple-system, sans-serif" font-size="10">体检</text>

      <circle cx="350" cy="530" r="9" fill="#28c840" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <path d="M346 530 L349 533 L354 527" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="350" y="560" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="-apple-system, sans-serif" font-size="10">复诊</text>

      <circle cx="600" cy="530" r="9" fill="none" stroke="rgba(72,191,227,0.85)" stroke-width="2"/>
      <text x="600" y="507" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="10">瑜伽课</text>

      <circle cx="850" cy="530" r="9" fill="none" stroke="rgba(255,150,180,0.85)" stroke-width="2"/>
      <text x="850" y="560" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="-apple-system, sans-serif" font-size="10">月末复盘</text>
    </g>

    <!-- Footer -->
    <line x1="100" y1="585" x2="1100" y2="585" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="140" y="608" fill="rgba(255,255,255,0.6)" font-family="-apple-system, sans-serif" font-size="12">＋ 新增主线</text>
    <text x="600" y="608" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="11">◑ ━━●━━━━━━━━━ 透明度</text>
    <text x="1060" y="608" text-anchor="end" fill="rgba(255,255,255,0.35)" font-family="-apple-system, sans-serif" font-size="11">点击节点勾选完成</text>
  </g>
</svg>
